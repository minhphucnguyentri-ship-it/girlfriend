
<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Website ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Xin chào ❤️</h1>

    <button id="openButton" onclick="showEnvelope()">
        Bấm vào đây ❤️
    </button>

    <!-- PHONG BÌ -->
    <div class="envelope hidden" id="envelope"
         onclick="toggleEnvelope()">

        <div class="envelope-back"></div>

        <div class="letter">
            <h2>❤️ Gửi bạn ❤️</h2>
            <p>Chúc bạn luôn vui vẻ và hạnh phúc!</p>
        </div>

        <div class="envelope-pocket">
            <div class="envelope-front"></div>
        </div>

        <div class="envelope-flap"></div>

        <div class="heart-seal">❤️</div>

    </div>

    <script src="script.js"></script>

</body>
</html>
